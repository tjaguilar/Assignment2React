<!doctype html> <!-- Tells the browser to use modern HTML. -->
<html lang="en"> <!-- Declares English as the page language for accessibility. -->
  <head> <!-- Holds page settings and metadata, not visible page content. -->
    <meta charset="UTF-8" /> <!-- Supports common text characters. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" /> <!-- Makes the layout adapt to mobile screen sizes. -->
    <meta name="description" content="Search a catalog of free-to-play games." /> <!-- Describes the site to browsers and search engines. -->
    <title>Game Explorer</title> <!-- Sets the browser tab title. -->
  </head> <!-- Ends the page metadata. -->
  <body> <!-- Holds the visible page content. -->
    <div id="root"></div> <!-- React mounts the application inside this element. -->
    <script type="module" src="/src/main.jsx"></script> <!-- Loads the React entry point. -->
  </body> <!-- Ends the body. -->
</html> <!-- Ends the HTML document. -->
